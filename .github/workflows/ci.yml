# Guru99 Telecom — CI
#   unit : test-data rules, id parsing, personal-data guard (no browser)    -> gates the build
#   e2e  : add customer -> add tariff -> assign tariff (+2 negative checks)
#          on demo.guru99.com in headless Chrome                            -> gates the build
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -ntp test -Punit

  e2e:
    name: End-to-end on demo.guru99.com (headless Chrome)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Telecom flow
        run: mvn -B -ntp test -Pe2e -Dheadless=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            target/surefire-reports
            target/failures
          if-no-files-found: ignore
